name: DASH Final Universal ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/DASH Final Universal ZIP.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: package signed carrier-preserving AOSP-Lineage ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CONTROLLER_REF: ad66cc16594509a84803965229e8841152fa9565
      OF_VENDOR_REF: cea00cabf2e8ce50fc9f0b5cda99b5801855847a
      RECOVERY_ARTIFACT_ID: "11519328294"
      RECOVERY_ARTIFACT_ARCHIVE_SHA256: c081634b52172bf3b1479e3205d4d89c2ee823b07015a01403a510ba37552477
      RECOVERY_FRAGMENT_SHA256: 234716e03db104d77b402cb676fedd1db15d77d6ce4f2cb5e7246b94618ffab8
      RECOVERY_RAW_SHA256: 4105365174e2cbdcc45e4098eefe2aa6b5372b4a31b29b6622b887cb42e29248

    steps:
      - name: Checkout public builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact private DASH controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_dash-recovery-source-14.1
          ref: ${{ env.CONTROLLER_REF }}
          path: .dash-controller
          ssh-key: ${{ secrets.DASH_TREE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Clone exact OrangeFox packaging source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://gitlab.com/OrangeFox/vendor/recovery.git .of-vendor
          git -C .of-vendor checkout -q "$OF_VENDOR_REF"
          test "$(git -C .of-vendor rev-parse HEAD)" = "$OF_VENDOR_REF"

      - name: Install signing runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: zulu
          java-version: "11"

      - name: Download exact proven recovery artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .input
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RECOVERY_ARTIFACT_ID}/zip" \
            -o .input/recovery-artifact.zip

          echo "${RECOVERY_ARTIFACT_ARCHIVE_SHA256}  .input/recovery-artifact.zip" | sha256sum -c -
          unzip -q .input/recovery-artifact.zip -d .input/recovery
          echo "${RECOVERY_FRAGMENT_SHA256}  .input/recovery/vendor_ramdisk_recovery.cpio" | sha256sum -c -

          gzip -dc .input/recovery/vendor_ramdisk_recovery.cpio > .input/ofox-recovery.cpio
          echo "${RECOVERY_RAW_SHA256}  .input/ofox-recovery.cpio" | sha256sum -c -

      - name: Stage package-only OrangeFox installer
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$PWD/.stage"
          PORT="$PWD/.dash-controller/release/installer-v4-a16-universal"
          OFV="$PWD/.of-vendor"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Native OrangeFox installer baseline.
          cp -a "$OFV/installer/." "$STAGE/"

          # Device-specific installer override, equivalent to FOX_PORTS_INSTALLER.
          cp -a "$PORT/." "$STAGE/"

          # Native OrangeFox outer-package marker.
          mkdir -p "$STAGE/META-INF/com/google/android"
          printf '#MAGISK\n' > "$STAGE/META-INF/com/google/android/updater-script"

          # Proven recovery payload only; never carry a full vendor_boot/recovery image.
          mkdir -p "$STAGE/payload"
          find "$STAGE/payload" -mindepth 1 -delete
          cp .input/ofox-recovery.cpio "$STAGE/payload/ofox-recovery.cpio"
          printf '%s  %s\n' "$RECOVERY_RAW_SHA256" "ofox-recovery.cpio" \
            > "$STAGE/payload/ofox-recovery.cpio.sha256"

          cp -p "$OFV/Files/INSTALL.txt" "$STAGE/INSTALL.txt"

          rm -f "$STAGE/recovery.img" "$STAGE/vendor_boot.img"
          rm -f "$STAGE/tools/dash_fdtpatch" "$STAGE/tools/dash_fstabnormalize"

          chmod 0755 \
            "$STAGE/META-INF/com/google/android/update-binary" \
            "$STAGE/tools/busybox" \
            "$STAGE/tools/magiskboot" \
            "$STAGE/tools/dash_avbrefresh" \
            "$STAGE/tools/dash_zstdcodec"

          sh -n "$STAGE/META-INF/com/google/android/update-binary"

          grep -F 'Carrier policy: preserve every non-recovery component' \
            "$STAGE/META-INF/com/google/android/update-binary"
          grep -F 'Carrier audit: all non-recovery files byte-identical' \
            "$STAGE/META-INF/com/google/android/update-binary"
          grep -F 'ro.boot.slot_suffix' \
            "$STAGE/META-INF/com/google/android/update-binary"

          ! grep -Eq 'for[[:space:]]+slot[[:space:]]+in[[:space:]]+_a[[:space:]]+_b' \
            "$STAGE/META-INF/com/google/android/update-binary"
          ! grep -Eq 'dash_fdtpatch|dash_fstabnormalize|platform\.orig|platform\.normalized|coherent-zstd' \
            "$STAGE/META-INF/com/google/android/update-binary"

      - name: Build, sign, and audit package-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/out-final"
          STAGE="$PWD/.stage"
          OFV="$PWD/.of-vendor"
          ZIP="$OUT/OrangeFox-R12.0-Unofficial-dash-AOSP-Lineage-Signed.zip"

          mkdir -p "$OUT"

          (
            cd "$STAGE"
            zip --exclude='*.git*' -q -r9 "$ZIP" . -z < "$OFV/Files/INSTALL.txt"
          )

          # Native OrangeFox signer.
          "$OFV/signature/sign_zip.sh" -z "$ZIP"

          unzip -t "$ZIP"
          jarsigner -verify "$ZIP" >/dev/null

          cmp -s <(printf '#MAGISK\n') <(unzip -p "$ZIP" META-INF/com/google/android/updater-script)

          ZIP_RAW_SHA="$(unzip -p "$ZIP" payload/ofox-recovery.cpio | sha256sum | awk '{print $1}')"
          [ "$ZIP_RAW_SHA" = "$RECOVERY_RAW_SHA256" ]

          ZIP_SUM_SHA="$(unzip -p "$ZIP" payload/ofox-recovery.cpio.sha256 | awk '{print $1}')"
          [ "$ZIP_SUM_SHA" = "$RECOVERY_RAW_SHA256" ]

          unzip -Z1 "$ZIP" | grep -F 'META-INF/MANIFEST.MF'
          unzip -Z1 "$ZIP" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$'

          ! unzip -Z1 "$ZIP" | grep -Eq '(^|/)(vendor_boot|recovery)\.img$'
          ! unzip -Z1 "$ZIP" | grep -Eq 'dash_fdtpatch|dash_fstabnormalize'

          unzip -p "$ZIP" META-INF/com/google/android/update-binary > "$OUT/update-binary.audit"
          grep -F 'Carrier policy: preserve every non-recovery component' "$OUT/update-binary.audit"
          grep -F 'Carrier audit: all non-recovery files byte-identical' "$OUT/update-binary.audit"
          grep -F 'ro.boot.slot_suffix' "$OUT/update-binary.audit"
          ! grep -Eq 'for[[:space:]]+slot[[:space:]]+in[[:space:]]+_a[[:space:]]+_b' "$OUT/update-binary.audit"

          ZIP_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          {
            echo "OFOX DASH package-only signed ZIP static audit"
            echo "controller_ref=$CONTROLLER_REF"
            echo "orangefox_vendor_ref=$OF_VENDOR_REF"
            echo "recovery_artifact_id=$RECOVERY_ARTIFACT_ID"
            echo "recovery_fragment_sha256=$RECOVERY_FRAGMENT_SHA256"
            echo "recovery_raw_sha256=$RECOVERY_RAW_SHA256"
            echo "zip_sha256=$ZIP_SHA"
            echo "zip_size=$(stat -c %s "$ZIP")"
            echo "outer_packaging=OrangeFox-native-style"
            echo "installer_override=FOX_PORTS_INSTALLER-equivalent"
            echo "updater_script=#MAGISK"
            echo "signed_with=vendor/recovery/signature/sign_zip.sh"
            echo "full_vendor_boot_payload=none"
            echo "full_recovery_img_payload=none"
            echo "carrier_policy=preserve-all-non-recovery-content"
            echo "target_slot=active-only"
            echo "static_audit=PASS"
          } > "$OUT/VERIFY.txt"

          cat "$OUT/VERIFY.txt"

      - name: Upload signed AOSP-Lineage ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ofox-dash-aosp-lineage-signed-${{ github.run_id }}
          path: out-final
          if-no-files-found: error
          retention-days: 7
