name: DASH Source Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    name: fox_14.1 source-lock
    runs-on: ubuntu-24.04

    env:
      TOP: ${{ github.workspace }}/../fox_14.1
      SOURCE_LOCK_OUT: ${{ github.workspace }}/.ci-artifacts/source-lock/fox_14.1

    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prepare official OrangeFox build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            linux-modules-extra-$(uname -r) git python3 tar aria2
          curl -fL -o /tmp/android_build_env.sh \
            https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh
          sudo bash /tmp/android_build_env.sh

      - name: Install OpenJDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: zulu
          java-version: "11"

      - name: Show runner resources
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU cores:"
          nproc
          echo
          echo "Memory:"
          free -h
          echo
          echo "Disk:"
          df -h /

      - name: Sync official fox_14.1 and capture source lock
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/capture-dash-source-lock.sh

      - name: Show post-sync resources
        if: always()
        shell: bash
        run: |
          nproc || true
          free -h || true
          df -h / || true

      - name: Upload provisional source lock
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fox-14.1-source-lock-${{ github.run_id }}
          path: ${{ env.SOURCE_LOCK_OUT }}
          if-no-files-found: error
          retention-days: 7
