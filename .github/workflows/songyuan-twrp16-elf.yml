# Approved 2026-10-17: public compute ONLY; private Songyuan OEM/code stays off GitHub public tracking/artifacts.
name: Songyuan TWRP16 private-source ELF on public 145G runner (NO IMG)
on:
  # Manual owner dispatch ONLY; never allow unreviewed forks/PRs to see private token.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: songyuan-private-source-public-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-pinned-songyuan:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'rakarizaldy-id' && github.repository == 'rakarizaldy-id/Action-OFRP-Builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TWRP_DIR: ${{ github.workspace }}/twrp
      OEM_DIR: ${{ github.workspace }}/.songyuan-oem
      OEM_ARCHIVE_DIR: ${{ github.workspace }}/.songyuan-oem-archive
      LOGS: ${{ github.workspace }}/songyuan-compact-source
    steps:
      - name: Verify 145GiB runner class before any private repository access
        shell: bash
        run: |
          set -euo pipefail
          df -hT "$GITHUB_WORKSPACE"
          total_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'END{print $2}')"
          if (( total_kib < 131072000 )); then
            echo "::error::Measured 72GiB private runner exhausted disk twice during incomplete 391-392 Repo sync."
            echo "::error::Stop without downloading. Need >=125GiB total/95GiB free; complete build still unproven."
            exit 40
          fi
      - name: Clean only unused packages on disposable GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          df -hT "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          df -hT "$GITHUB_WORKSPACE"
          free_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'END{print $4}')"
          if (( free_kib < 99614720 )); then
            echo "::error::Less than 95GiB free after cleanup; refuse costly source checkout"
            exit 40
          fi
      - name: Require user-provisioned repo-scoped credential, fail before private download
        shell: bash
        env:
          SONREPO_TOKEN: ${{ secrets.SONGYUAN_PRIVATE_RW_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$SONREPO_TOKEN" ]]; then
            echo "::error::Secret SONGYUAN_PRIVATE_RW_TOKEN has not been provisioned in this PUBLIC repo. No private source accessed. Set fine-grained short-lived token scoped ONLY to private TWRP-songyuan-Builder with Contents read/write; do NOT print token."
            exit 44
          fi
          echo "Repository secret present. Contents access and private draft release permissions will be validated during checkout and release stages."
      - name: Checkout first-party Songyuan scripts (private)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/TWRP-songyuan-Builder
          ref: 04f84342b995c5e016c1f572163916e4d530d1a3
          token: ${{ secrets.SONGYUAN_PRIVATE_RW_TOKEN }}
          path: project
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Confirm exact device source and CLI script guards
        run: |
          set -euo pipefail
          test "$(git -C project rev-parse HEAD)" = "04f84342b995c5e016c1f572163916e4d530d1a3"
          python3 project/tools/songyuan/validate_clean.py project/device/xiaomi/songyuan
          # Full first-party source contract runs BEFORE 392-project sync, but do
          # not expose private service/OEM filenames in PUBLIC workflow logs.
          if ! python3 project/tools/songyuan/audit_complete_static.py > "$RUNNER_TEMP/songyuan-full-static-audit.log" 2>&1; then
            echo "::error::Private first-party native preflight failed; see private diagnostic release"
            exit 45
          fi
          echo "PASS: full first-party source-only audit; runtime NOT proven"
          bash -n project/tools/songyuan/compact_twrp16_ci.sh
          bash -n project/tools/songyuan/probe_clang_sparse.sh
      - name: Install first-party TWRP16 Linux build tool prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends repo git curl ca-certificates python3 python3-pip gh lz4 cpio bc bison flex gperf zip unzip rsync libxml2-utils libssl-dev liblz4-tool zstd build-essential binutils
      - name: Checkout all 392 official TWRP16 source projects with sparse native Clang
        shell: bash
        run: bash project/tools/songyuan/compact_twrp16_ci.sh "$TWRP_DIR" "$LOGS"
      - name: Verify original PRIVATE ID305 OEM (after source sync, no donor)
        env:
          GH_TOKEN: ${{ secrets.SONGYUAN_PRIVATE_RW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OEM_ARCHIVE_DIR"
          gh release download songyuan-id305-oem-20261016-v3 --repo "rakarizaldy-id/TWRP-songyuan-Builder" --pattern songyuan-id305-curated.tar.gz --dir "$OEM_ARCHIVE_DIR"
          echo 'db44de838e34151fcf76f19e356bb3d2abfcb0038104fc2dcd5590edcfeb9d40  songyuan-id305-curated.tar.gz' | (cd "$OEM_ARCHIVE_DIR"; sha256sum -c)
          python3 project/ports/yukong-songyuan/check_cloud_payload.py "$OEM_ARCHIVE_DIR/songyuan-id305-curated.tar.gz" "$OEM_DIR"
          python3 project/tools/songyuan/curate_oem.py --verify "$OEM_DIR"
          python3 project/tools/songyuan/verify_oem.py "$OEM_DIR"
      - name: Stage original Songyuan ID305 and guarded native security patch
        shell: bash
        run: |
          set -euo pipefail
          python3 project/ports/yukong-songyuan/patch_crypto_id305.py "$TWRP_DIR"
          bash project/tools/songyuan/prepare.sh "$TWRP_DIR" "$OEM_DIR"
          python3 project/tools/songyuan/validate_clean.py "$TWRP_DIR/device/xiaomi/songyuan" --staged
          # Full recovery/root staged OEM paths and native service closure audit.
          # Audit output and private file names are NOT echoed on public runner.
          if ! python3 project/tools/songyuan/audit_complete_static.py --staged "$TWRP_DIR/device/xiaomi/songyuan" > "$RUNNER_TEMP/songyuan-full-staged-audit.log" 2>&1; then
            echo "::error::Private staged native graph audit failed; see private diagnostic release"
            exit 46
          fi
          cp "$TWRP_DIR/device/xiaomi/.songyuan-native-full-audit.json" "$RUNNER_TEMP/songyuan-full-staged-audit.json"
          echo "PASS: full staged Songyuan source/OEM root graph audit; ELF still uncompiled"
      - name: Guard remaining space and provide bounded swap
        shell: bash
        run: |
          set -euo pipefail
          free_kib="$(df -Pk "$TWRP_DIR" | awk 'END{print $4}')"
          echo "Pre-Soong free GiB = $((free_kib/1048576))" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( free_kib < 25165824 )); then
            echo "::error::Less than 24GiB free before 6GiB swap and Soong; no compile"
            exit 42
          fi
          sudo fallocate -l 6G "$RUNNER_TEMP/songyuan-swapfile"
          sudo chmod 600 "$RUNNER_TEMP/songyuan-swapfile"
          sudo mkswap "$RUNNER_TEMP/songyuan-swapfile"
          sudo swapon "$RUNNER_TEMP/songyuan-swapfile"
          swapon --show
          df -hT "$TWRP_DIR"
      - name: Lunch and compile ONLY TWRP recovery ELF plus servicemanager
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/songyuan-run-compile.sh" <<'SH'
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$TWRP_DIR"
          source build/envsetup.sh
          # Official TWRP-Test twrp-16.0 reduced manifest build mode.
          # This avoids global optional Java/test/BPF defaults blocking Soong.
          # Missing input dependencies at Ninja level still fail the build;
          # auditable compiled ARM64 TWRP ELF is mandatory, NOT an IMG.
          export ALLOW_MISSING_DEPENDENCIES=true
          # Exact registered original device product in AndroidProducts.mk.
          lunch twrp_songyuan-bp2a-eng
          test "$TARGET_PRODUCT" = twrp_songyuan
          echo "CHECKPOINT: Songyuan native lunch success"
          m -j2 recovery servicemanager.recovery
          SH
          chmod 700 "$RUNNER_TEMP/songyuan-run-compile.sh"
          setsid timeout --signal=TERM --kill-after=40s 12500s bash "$RUNNER_TEMP/songyuan-run-compile.sh" > "$RUNNER_TEMP/songyuan-compact-compile.log" 2>&1 &
          pid=$!
          stopped=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 20
            space="$(df -Pk "$TWRP_DIR" | awk 'END{print $4}')"
            echo "compile_free_kib=$space"
            if (( space < 6291456 )); then
              echo "::error::Compile output disk reserve below 6GiB; stopping safely"
              kill -TERM -- "-$pid" 2>/dev/null || true
              stopped=1
              break
            fi
          done
          status=0
          wait "$pid" || status=$?
          if (( stopped )); then status=99; fi
          echo "compiled_process_exit=$status"
          # Logs may mention genuine private OEM; never emit raw compiler output into PUBLIC job logs.
          echo "Compiler log retained in runner; diagnostics delivered only to PRIVATE repository."
          df -hT "$TWRP_DIR"
          exit "$status"
      - name: Export compiled ARM64 ELF with complete same-build DT_NEEDED runtime closure
        shell: bash
        run: |
          set -euo pipefail
          product="$TWRP_DIR/out/target/product/songyuan"
          root="$product/recovery/root"
          out="$RUNNER_TEMP/songyuan-compact-binary"
          mkdir -p "$out/paired-runtime"
          src=""
          for p in "$root/system/bin/recovery" "$root/sbin/recovery" "$product/obj/EXECUTABLES/recovery_intermediates/recovery"; do
            if [[ -s "$p" ]] && readelf -h "$p" 2>/dev/null | grep -q 'Machine:.*AArch64'; then src="$p"; break; fi
          done
          if [[ -z "$src" ]]; then
            while IFS= read -r p; do
              if readelf -h "$p" 2>/dev/null | grep -q 'Machine:.*AArch64'; then src="$p"; break; fi
            done < <(find "$TWRP_DIR/out/soong/.intermediates/bootable/recovery" "$root" -type f -name recovery 2>/dev/null | sort -u || true)
          fi
          test -n "$src"
          cp -p "$src" "$out/recovery"
          for rel in system/bin/servicemanager system/lib64/libbinder.so system/lib64/libbinder_ndk.so; do
            if [[ -s "$root/$rel" ]]; then
              mkdir -p "$out/paired-runtime/$(dirname "$rel")"
              cp -L "$root/$rel" "$out/paired-runtime/$rel"
            fi
          done
          (cd "$out"; find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          # Retain *only* original public source revision hashes and first-party
          # private source commit ID. No repository source tar or OEM is published.
          test -s "$LOGS/392-verified-source-revisions.tsv"
          test -s "$LOGS/resolved-391-projects.xml"
          cp "$LOGS/392-verified-source-revisions.tsv" "$out/392-verified-source-revisions.tsv"
          cp "$LOGS/resolved-391-projects.xml" "$out/resolved-391-projects.xml"
          printf 'private-native-tree-commit\t%s\n' "$(git -C project rev-parse HEAD)" > "$out/native-source-lock.tsv"
          (cd "$out"; sha256sum 392-verified-source-revisions.tsv resolved-391-projects.xml native-source-lock.tsv > SOURCE-LOCK-SHA256SUMS)
          # Now fail closed if mandatory source-built RECO Binder pair is absent.
          python3 project/ports/yukong-songyuan/audit_compiled_runtime.py "$out" "$root"
          # Fail closed on ANY direct/transitive ELF SONAME not available from
          # this exact built recovery root; never substitute donor libraries.
          python3 project/ports/yukong-songyuan/export_native_runtime_closure.py "$out" "$root"
          test -s "$out/NATIVE-RUNTIME-CLOSURE.json"
          printf 'BINARY ONLY — NOT FLASHABLE; No IMG created. Must audit linker/ABI and repack only in ChatGPT.\n' > "$out/README.txt"
      - name: Securely transfer ONLY audited ELF bundle to DRAFT release in original PRIVATE Songyuan repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SONGYUAN_PRIVATE_RW_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          out="$RUNNER_TEMP/songyuan-compact-binary"
          test -s "$out/recovery"
          test -s "$out/COMPILED-RUNTIME-ABI-AUDIT.json"
          test -s "$out/NATIVE-RUNTIME-CLOSURE.json"
          readelf -h "$out/recovery" | grep -q 'Machine:.*AArch64'
          cat > "$out/README-NOT-FLASHABLE.txt" <<'EOF'
          Original first-party Songyuan ID305 TWRP16 executable ONLY.
          NOT a recovery IMG. Do not flash. ABI, Binder and CE decrypt unverified.
          No OS userdata / metadata / KeyMint blobs changed.
          EOF
          (cd "$out"; find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C "$out" -czf "$RUNNER_TEMP/songyuan-twrp16-elf-only.tar.gz" .
          sha256sum "$RUNNER_TEMP/songyuan-twrp16-elf-only.tar.gz" > "$RUNNER_TEMP/songyuan-twrp16-elf-only.tar.gz.sha256"
          cat > "$RUNNER_TEMP/songyuan-private-release-notes.txt" <<'EOF'
          Original POCO F9 Ultra (songyuan), genuine ID305 private OEM.
          ONLY source-built TWRP16 executable, exact DT_NEEDED ARM64 runtime closure, and ABI audit.
          NOT FLASHABLE. No recovery.img, no signing, no donor, no phone operations.
          Runtime Binder pair/CE decryption NOT verified. These files are not stock-ramdisk-tested.
          Offline Songyuan ID305 stock ramdisk assembly/check required.
          EOF
          tag="songyuan-twrp16-elf-only-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$RUNNER_TEMP/songyuan-twrp16-elf-only.tar.gz" \
            "$RUNNER_TEMP/songyuan-twrp16-elf-only.tar.gz.sha256" \
            --repo rakarizaldy-id/TWRP-songyuan-Builder --draft \
            --title "PRIVATE Songyuan TWRP16 ELF only $GITHUB_RUN_ID" \
            --notes-file "$RUNNER_TEMP/songyuan-private-release-notes.txt"
          echo 'ONLY private DRAFT release created; NO public artifacts or flash image'
      - name: Return diagnostics ONLY to private draft release on failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SONGYUAN_PRIVATE_RW_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'No token configured; no private release or firmware operation attempted.'
            exit 0
          fi
          trace="$RUNNER_TEMP/private-songyuan-diagnostics"
          mkdir -p "$trace"
          for p in "$RUNNER_TEMP/songyuan-compact-compile.log" "$LOGS/repo-sync.log" \
            "$LOGS/after-repo-sync-disk.txt" "$LOGS/after-clang-disk.txt" \
            "$LOGS/incomplete-source-inventory.txt" "$LOGS/disk-heartbeat.tsv" \
            "$RUNNER_TEMP/songyuan-full-static-audit.log" \
            "$RUNNER_TEMP/songyuan-full-staged-audit.log" \
            "$RUNNER_TEMP/songyuan-full-staged-audit.json" \
            "$RUNNER_TEMP/songyuan-compact-binary/COMPILED-RUNTIME-ABI-AUDIT.json" \
            "$RUNNER_TEMP/songyuan-compact-binary/NATIVE-RUNTIME-CLOSURE.json" \
            "$RUNNER_TEMP/songyuan-compact-binary/NOT-READY-FOR-IMAGE-REPLACEMENT.txt" \
            "$LOGS/392-verified-source-revisions.tsv" "$LOGS/SOURCE-SHA256SUMS.txt"; do
            if [[ -f "$p" ]]; then cp -- "$p" "$trace/$(basename "$p")"; fi
          done
          if [[ -z "$(find "$trace" -type f -print -quit)" ]]; then
            echo 'No local diagnostic logs yet; credentials/runner may have stopped pre-sync.'
            exit 0
          fi
          printf 'PRIVATE diagnostic log only - no OEM binaries, no image and no flash.\n' > "$trace/README.txt"
          (cd "$trace"; tar -czf "$RUNNER_TEMP/private-diagnostics.tar.gz" .)
          gh release create "songyuan-twrp16-private-fail-${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP/private-diagnostics.tar.gz" \
            --repo rakarizaldy-id/TWRP-songyuan-Builder --draft \
            --title "PRIVATE diagnostic only: Songyuan TWRP16 run $GITHUB_RUN_ID" \
            --notes "Private source compile diagnostic; NOT binary or flashable" \
            || echo "::error::Failed to upload private diagnostics; do not publish logs"
