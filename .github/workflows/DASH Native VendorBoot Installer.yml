name: DASH Native VendorBoot Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/DASH Native VendorBoot Installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofox-dash-native-installer
  cancel-in-progress: false

jobs:
  build:
    name: native OrangeFox vendor_boot ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      TOP: ${{ github.workspace }}/fox_14.1
      CONTROLLER_ROOT: ${{ github.workspace }}/.dash-controller
      BUILD_USERNAME: orangefox
      BUILD_HOSTNAME: github-actions
      FOX_BUILD_DEVICE: dash
      FOX_BUILD_TYPE: Alpha
      FOX_VENDOR_BOOT_RECOVERY: "1"
      FOX_VIRTUAL_AB_DEVICE: "1"
      FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL: "1"

    steps:
      - name: Reclaim runner disk
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Checkout public builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact private DASH controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_dash-recovery-source-14.1
          ref: d3479082c7dbd9078db824a47336a7585890187e
          path: .dash-controller
          ssh-key: ${{ secrets.DASH_TREE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare official OrangeFox build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            linux-modules-extra-$(uname -r) git python3 tar aria2 zstd
          curl -fL -o /tmp/android_build_env.sh \
            https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh
          sudo bash /tmp/android_build_env.sh

      - name: Install OpenJDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: zulu
          java-version: "11"

      - name: Prepare and verify canonical fox_14.1 source
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/prepare-dash-build-source.sh

      - name: Checkout exact DASH device tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_dash-recovery-source-14.1
          ref: d3479082c7dbd9078db824a47336a7585890187e
          path: fox_14.1/device/xiaomi/dash
          ssh-key: ${{ secrets.DASH_TREE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Create 30 GB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 30

      - name: Prepare DASH recovery layer
        shell: bash
        run: |
          set -euo pipefail
          bash "$CONTROLLER_ROOT/tools/apply-dash-recovery-layer.sh" "$TOP"

      - name: Build native OrangeFox vendor_boot installer
        shell: bash
        run: |
          set -eo pipefail
          unset JOBS NINJA_REMOTE_NUM_JOBS MAKEFLAGS FOX_DISABLE_UPDATEZIP
          export OUT_DIR=out
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_USE_NANO_EDITOR=0
          export FOX_EXCLUDE_NANO_EDITOR=1
          export FOX_ENABLE_APP_MANAGER=1
          export FOX_ADD_API_V36_PREBUILTS=2

          cd "$TOP"
          set +u
          source build/envsetup.sh
          lunch twrp_dash-ap2a-eng

          m fs_config_files_system fs_config
          m adbd vendorbootimage 2>&1 | tee "$GITHUB_WORKSPACE/native-vendorboot-build.log"

      - name: Audit native OrangeFox ZIP
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_OUT="$TOP/out/target/product/dash"
          OUT="$GITHUB_WORKSPACE/native-output"
          mkdir -p "$OUT"

          mapfile -t ZIPS < <(find "$PRODUCT_OUT" -maxdepth 1 -type f -name '*.zip' | sort)
          [ "${#ZIPS[@]}" -gt 0 ] || { echo "No native OrangeFox ZIP produced" >&2; exit 20; }

          ZIP="${ZIPS[-1]}"
          cp -f "$ZIP" "$OUT/"
          cp -f "$GITHUB_WORKSPACE/native-vendorboot-build.log" "$OUT/"

          RAMDISK_IN_ZIP="$(unzip -Z1 "$ZIP" | grep -E '(^|/)vendor_ramdisk_recovery\.cpio$' | head -n1)"
          [ -n "$RAMDISK_IN_ZIP" ] || { echo "vendor_ramdisk_recovery.cpio missing from native ZIP" >&2; exit 21; }

          UPDATE_BINARY="META-INF/com/google/android/update-binary"
          UPDATER_SCRIPT="META-INF/com/google/android/updater-script"

          unzip -p "$ZIP" "$UPDATER_SCRIPT" | grep -Fx '#MAGISK'
          unzip -p "$ZIP" "$UPDATE_BINARY" | grep -Eq '^TARGET_DEVICE="dash"$'
          unzip -p "$ZIP" "$UPDATE_BINARY" | grep -Eq '^FOX_AB_DEVICE="1"$'
          unzip -p "$ZIP" "$UPDATE_BINARY" | grep -Eq '^FOX_VIRTUAL_AB_DEVICE="1"$'
          unzip -p "$ZIP" "$UPDATE_BINARY" | grep -Eq '^FOX_VENDOR_BOOT_RECOVERY="1"$'
          unzip -p "$ZIP" "$UPDATE_BINARY" | grep -Eq '^FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL="1"$'

          unzip -Z1 "$ZIP" | grep -F 'META-INF/MANIFEST.MF'
          unzip -Z1 "$ZIP" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$'

          unzip -p "$ZIP" "$RAMDISK_IN_ZIP" > "$OUT/vendor_ramdisk_recovery.cpio"
          RAMDISK_SHA="$(sha256sum "$OUT/vendor_ramdisk_recovery.cpio" | awk '{print $1}')"
          ZIP_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"

          {
            echo "native_orangefox_zip=$(basename "$ZIP")"
            echo "controller_ref=d3479082c7dbd9078db824a47336a7585890187e"
            echo "zip_sha256=$ZIP_SHA"
            echo "zip_size=$(stat -c %s "$ZIP")"
            echo "vendor_ramdisk_recovery_sha256=$RAMDISK_SHA"
            echo "updater_script_magisk=true"
            echo "fox_ab_device=1"
            echo "fox_virtual_ab_device=1"
            echo "fox_vendor_boot_recovery=1"
            echo "fox_installer_vendor_boot_ramdisk_install=1"
            echo "zip_signed=true"
            echo "native_audit=PASS"
          } > "$OUT/NATIVE_VERIFY.txt"
          cat "$OUT/NATIVE_VERIFY.txt"

      - name: Upload native OrangeFox installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ofox-dash-native-installer-${{ github.run_id }}
          path: native-output
          if-no-files-found: error
          retention-days: 7
