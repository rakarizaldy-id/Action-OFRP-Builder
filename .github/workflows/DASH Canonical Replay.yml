name: DASH Canonical Replay

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/replay-dash-source-lock.sh"
      - ".github/workflows/DASH Canonical Replay.yml"

permissions:
  contents: read

jobs:
  replay:
    name: replay canonical fox_14.1
    runs-on: ubuntu-24.04

    env:
      TOP: ${{ github.workspace }}/../fox_14.1-replay
      LOCK_DIR: ${{ github.workspace }}/.ci-staging/source-lock/fox_14.1

    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prepare official OrangeFox build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq \
            linux-modules-extra-$(uname -r) git python3 tar aria2
          curl -fL -o /tmp/android_build_env.sh \
            https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh
          sudo bash /tmp/android_build_env.sh

      - name: Install OpenJDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: zulu
          java-version: "11"

      - name: Show pre-replay resources
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h /

      - name: Replay and verify canonical source lock
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/replay-dash-source-lock.sh

      - name: Show post-replay resources
        if: always()
        shell: bash
        run: |
          nproc || true
          free -h || true
          df -h / || true
