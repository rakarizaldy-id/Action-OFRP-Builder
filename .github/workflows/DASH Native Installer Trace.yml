name: DASH Native Installer Trace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/DASH Native Installer Trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone exact OrangeFox vendor/recovery
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://gitlab.com/OrangeFox/vendor/recovery.git of-vendor
          cd of-vendor
          git checkout -q cea00cabf2e8ce50fc9f0b5cda99b5801855847a
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Trace native post-build dispatcher
        shell: bash
        run: |
          set -euo pipefail
          cd of-vendor
          echo "===== dispatcher refs ====="
          grep -nE 'Fox_After_Recovery_Image|FOX_DISABLE_UPDATEZIP|ORANGEFOX_CALLING_CARD|Make_.*[Zz]ip|create.*[Zz]ip|ZIP_FILE=' OrangeFox_A14.sh || true

          echo "===== around Fox_After_Recovery_Image definition ====="
          L=$(grep -n '^Fox_After_Recovery_Image()' OrangeFox_A14.sh | head -n1 | cut -d: -f1)
          [ -n "$L" ] || { echo "definition missing"; exit 2; }
          A=$((L-40)); [ $A -lt 1 ] && A=1
          B=$((L+220))
          sed -n "${A},${B}p" OrangeFox_A14.sh

          echo "===== around FOX_DISABLE_UPDATEZIP refs ====="
          while IFS=: read -r n rest; do
            [ -n "$n" ] || continue
            A=$((n-20)); [ $A -lt 1 ] && A=1
            B=$((n+35))
            echo "--- lines $A..$B ---"
            sed -n "${A},${B}p" OrangeFox_A14.sh
          done < <(grep -n 'FOX_DISABLE_UPDATEZIP' OrangeFox_A14.sh || true)

          echo "===== final command dispatch ====="
          tail -n 180 OrangeFox_A14.sh
