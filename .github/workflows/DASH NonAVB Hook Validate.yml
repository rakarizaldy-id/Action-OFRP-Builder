name: DASH NonAVB Hook Validate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/DASH NonAVB Hook Validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_dash-recovery-source-14.1
          ref: d3479082c7dbd9078db824a47336a7585890187e
          path: controller
          ssh-key: ${{ secrets.DASH_TREE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source-lock checksum and exact patch application
        shell: bash
        run: |
          set -euo pipefail
          cd controller/PROJECT_NOTES/SOURCE_LOCK/fox_14.1
          sha256sum -c SHA256SUMS

          cd "$GITHUB_WORKSPACE"
          git clone -q https://github.com/nebrassy/android_build.git build-make
          cd build-make
          git checkout -q 506df226dd003a364916b6b3ee1eb3bf9064f97f
          git apply --check "$GITHUB_WORKSPACE/controller/PROJECT_NOTES/SOURCE_LOCK/fox_14.1/patches/build/make.patch"
          git apply "$GITHUB_WORKSPACE/controller/PROJECT_NOTES/SOURCE_LOCK/fox_14.1/patches/build/make.patch"

          grep -n -A38 -B4 'vendor_boot (non-AVB)' core/Makefile
          test "$(grep -c 'FOX_VENDOR_CMD="Fox_After_Recovery_Image"' core/Makefile)" -ge 4
          echo "NON_AVB_HOOK_PATCH=PASS"
