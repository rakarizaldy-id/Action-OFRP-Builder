name: DASH Recovery Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofox-dash-recovery-build
  cancel-in-progress: false

jobs:
  build:
    name: canonical DASH recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      TOP: ${{ github.workspace }}/fox_14.1
      CONTROLLER_ROOT: ${{ github.workspace }}/.dash-controller
      LOCK_DIR: ${{ github.workspace }}/.dash-controller/PROJECT_NOTES/SOURCE_LOCK/fox_14.1
      ARTIFACT_DIR: ${{ github.workspace }}/.ci-artifacts/dash-recovery
      BUILD_USERNAME: orangefox
      BUILD_HOSTNAME: github-actions

    steps:
      - name: Reclaim runner disk
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Checkout public builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout private DASH controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_dash-recovery-source-14.1
          ref: c959074f682a73dca9ab1bb79b8677f82644dccc
          path: .dash-controller
          ssh-key: ${{ secrets.DASH_TREE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare official OrangeFox build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            linux-modules-extra-$(uname -r) git python3 tar aria2 zstd
          curl -fL -o /tmp/android_build_env.sh \
            https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh
          sudo bash /tmp/android_build_env.sh

      - name: Install OpenJDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: zulu
          java-version: "11"

      - name: Show pre-sync resources
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h /

      - name: Prepare and verify canonical fox_14.1 source
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./tools/prepare-dash-build-source.sh
          bash -n "$CONTROLLER_ROOT/recovery/root/system/bin/runatboot.sh"
          bash ./tools/prepare-dash-build-source.sh

      - name: Checkout DASH device tree into Android source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_dash-recovery-source-14.1
          ref: c959074f682a73dca9ab1bb79b8677f82644dccc
          path: fox_14.1/device/xiaomi/dash
          ssh-key: ${{ secrets.DASH_TREE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Create 30 GB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 30

      - name: Show pre-build resources
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h /

      - name: Build recovery-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          unset JOBS NINJA_REMOTE_NUM_JOBS
          bash "$CONTROLLER_ROOT/tools/build-dash-recovery-only.sh"

      - name: Show post-build resources
        if: always()
        shell: bash
        run: |
          nproc || true
          free -h || true
          df -h / || true

      - name: Upload DASH recovery artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ofox-dash-recovery-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
